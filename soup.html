<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="soup.css">   
  </head>
  <body>
    <h1>How To Make Chicken Noodle Soup</h1>
    <h3>Step 1</h3>
    <ul>
      <li>Get some vegetables</li>
    </ul>
    <h3>Step 2</h3>
    <ul>
      <li>Cook vegetables for 3 minutes in a pot</li>
    </ul>
    <h3>Step 3</h3>
    <ul>
      <li>Add chicken broth to pot</li>
    </ul>
    <h3>Step 4</h3>
    <ul>
      <li>Add pasta</li>
    </ul>
    <h3>Step 5</h3>
    <ul>
      <li>Add chicken</li>
    </ul>
    <h3>Step 6</h3>
    <ul>
      <li>Pour it into a bowl and enjoy!</li>
    </ul>
  </body>
</html>
